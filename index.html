<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person 🧸</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --soft-pink: #ffdae0;
            --deep-rose: #ff8fa3;
            --text-color: #5d4037;
            --bg-cream: #fffaf0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-cream);
            color: var(--text-color);
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .handwritten {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: var(--deep-rose);
        }

        /* --- SCREEN 1: THE WELCOME --- */
        #welcome {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .main-teddy {
            width: 200px;
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: float 3s ease-in-out infinite;
        }

        .main-teddy:hover { transform: scale(1.1); }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .btn-start {
            margin-top: 30px;
            padding: 15px 40px;
            background: var(--deep-rose);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 143, 163, 0.4);
            transition: 0.3s;
        }

        /* --- SCREEN 2: POLAROID GALLERY --- */
        #gallery {
            display: none;
            padding: 100px 5%;
            text-align: center;
        }

        .polaroid-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            max-width: 1200px;
            margin: 50px auto;
        }

        .polaroid {
            background: white;
            padding: 15px 15px 40px 15px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: 0.4s;
            cursor: pointer;
            transform: rotate(var(--rotation));
        }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.05);
            z-index: 5;
            box-shadow: 0 15px 35px rgba(255, 143, 163, 0.2);
        }

        .polaroid img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 2px;
            background: #fff5f5;
        }

        .caption {
            margin-top: 20px;
            font-size: 1.1rem;
            line-height: 1.4;
            font-weight: 600;
        }

        /* --- INTERACTION --- */
        .question-zone { margin: 80px 0; }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            height: 60px;
        }

        .btn-yes {
            padding: 15px 50px;
            background: var(--deep-rose);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .btn-no {
            padding: 15px 50px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 50px;
            cursor: pointer;
        }

        /* --- FINAL REVEAL --- */
        #celebration {
            display: none;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: white;
            position: relative;
            overflow: hidden;
        }

        /* ANIMATED ELEMENTS */
        .petal, .bubble {
            position: absolute;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        @keyframes rise {
            to { transform: translateY(-100vh); opacity: 0; }
        }

        @media (max-width: 1024px) { .polaroid-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .polaroid-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <section id="welcome">
        <img src="hii.gif" class="main-teddy" onclick="start()">
        <h1 class="handwritten" style="font-size: 3rem; margin-top: 20px;">Hii... Ek surprise hai!</h1>
        <button class="btn-start" onclick="start()">Open it? ✨</button>
    </section>

    <section id="gallery">
        <h2 class="handwritten" style="font-size: 3.5rem;">Mere Kuch Dil Ki Baatein...</h2>
        <div class="polaroid-grid" id="grid"></div>

        <div class="question-zone">
            <h2 class="handwritten" style="font-size: 3rem;">Sunno... Will you be my Valentine?</h2>
            <div class="btn-group">
                <button class="btn-yes" onclick="celebrate()">YES! 💖</button>
                <button id="no-btn" class="btn-no" onmouseover="escape(this)">Noo</button>
            </div>
        </div>
    </section>

    <section id="celebration">
        <h1 class="handwritten" style="font-size: 5rem;">Yayyy!</h1>
        <p style="font-size: 1.5rem; font-weight: 600;">I'm the luckiest person ever!</p>
        <img src="download.gif" width="200" style="margin-top: 30px;">
    </section>

    <script>
        const texts = [
            "Pata hai? Tumhari smile pure din ki thakawat mita deti hai.",
            "I love how you listen to me, even when I'm talking nonsense.",
            "Tumhare saath silence bhi kitna pyara lagta hai.",
            "You are the safest home I've ever known.",
            "I promise, main hamesha tumhara saath dunga.",
            "Tumhari baatein mere boring din ko best bana deti hain.",
            "I love the person I am when I am with you.",
            "Bas hamesha aise hi rehna, mere liye tum kaafi ho."
        ];

        // APNI IMAGES KE FILENAMES YAHAN DALO
        const myImages = [
            "img1.gif", 
            "agg.gif", 
            "img3.gif", 
            "img4.gif",
            "hug.gif",
            "img6.gif",
            "kiss.gif",
            "img8.gif"
        ];

        function start() {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('gallery').style.display = 'block';
            const grid = document.getElementById('grid');
            
            texts.forEach((text, i) => {
                const rot = (Math.random() * 10 - 5).toFixed(2);
                const card = document.createElement('div');
                card.className = 'polaroid';
                card.style.setProperty('--rotation', rot + 'deg');
                card.innerHTML = `
                    <img src="${myImages[i]}" alt="Memory">
                    <p class="caption">${text}</p>
                `;
                grid.appendChild(card);
            });
        }

        function escape(btn) {
            const x = Math.random() * (window.innerWidth - btn.clientWidth);
            const y = Math.random() * (window.innerHeight - btn.clientHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('gallery').style.display = 'none';
            const screen = document.getElementById('celebration');
            screen.style.display = 'flex';
            
            // Start Effects
            for(let i=0; i<35; i++) createEffect('petal', '🌸');
            for(let i=0; i<25; i++) createEffect('bubble', '🫧');
        }

        function createEffect(className, emoji) {
            const el = document.createElement('div');
            el.className = className;
            el.innerHTML = emoji;
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * 20 + 20) + 'px';
            
            if(className === 'petal') {
                el.style.top = '-50px';
                el.style.animation = `fall ${Math.random() * 3 + 3}s linear forwards`;
            } else {
                el.style.top = '100vh';
                el.style.animation = `rise ${Math.random() * 4 + 4}s ease-in forwards`;
            }
            document.getElementById('celebration').appendChild(el);
        }
    </script>
</body>
</html>
